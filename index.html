<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Boris Simov - Medical Case Dossier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="lang-bg">

    <div class="app-container">
        
        <div class="dossier-panel" id="dossier-panel">
            
            <div class="patient-header">
                <div class="profile-main">
                    <h2 class="patient-name"></h2>
                    <div class="patient-meta"></div>
                </div>
                
                <div class="lang-switch">
                    <button id="btn-lang-bg" class="lang-btn active">BG</button>
                    <button id="btn-lang-en" class="lang-btn">EN</button>
                </div>
            </div>

            <div class="dossier-content">
                
                <div class="clinical-alert"></div>

                <div class="dossier-nav"></div>

                <div id="sec-summary" class="dossier-section active"></div>

                <div id="sec-studies" class="dossier-section"></div>

                <div id="sec-timeline" class="dossier-section"></div>

                <div id="sec-questions" class="dossier-section"></div>

            </div>

        </div>
        
        <div class="viewer-panel" id="viewer-panel">
            
            <div class="viewer-top-bar">
                <div class="viewer-title">
                    <span id="active-viewer-icon">🩺</span> 
                    <span id="active-viewer-title-bg" data-lang="bg"></span>
                    <span id="active-viewer-title-en" data-lang="en"></span>
                </div>
                
                <div id="viewer-quick-actions" class="viewer-quick-actions"></div>
            </div>

            <div class="viewer-contents">
                
                <div id="xray-viewer" class="viewer-container">
                    <div class="thumbnail-sidebar" id="xray-thumbnails"></div>
                    <div class="image-display-area" id="imageDisplayArea">
                        <div class="viewer-header"><span id="image-counter"></span></div>
                        <img class="main-image" id="mainImage" src="">
                        <button class="nav-button prev" id="prevImageBtn">&#10094;</button>
                        <button class="nav-button next" id="nextImageBtn">&#10095;</button>
                        <div class="zoom-controls">
                            <button class="zoom-button" id="zoomInBtn">+</button>
                            <button class="zoom-button" id="zoomOutBtn">-</button>
                        </div>
                        
                        <div class="image-adjust-overlay" id="imageAdjustOverlay">
                            <div class="control-group">
                                <label for="brightness">Brt</label>
                                <input type="range" id="brightness" min="0" max="200" value="100" title="Brightness">
                            </div>
                            <div class="control-group">
                                <label for="contrast">Con</label>
                                <input type="range" id="contrast" min="0" max="200" value="100" title="Contrast">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="pdf-viewer" class="pdf-container">
                    <embed id="pdf-embed" src="" type="application/pdf" width="100%" height="100%">
                </div>

                <div id="welcome-viewer" class="welcome-container">
                    <div class="welcome-box">
                        <h3 data-lang="bg"></h3>
                        <h3 data-lang="en"></h3>
                        <p data-lang="bg"></p>
                        <p data-lang="en"></p>
                    </div>
                </div>
                
            </div>
            
            <div class="metadata-footer">
                <span><strong>DOB:</strong> <span id="meta-dob-age">10 Jan 1984</span></span>
                <span><strong>Days since accident:</strong> <span id="meta-days-since">0</span></span>
            </div>

        </div>

        <div class="mobile-nav-bar" id="mobile-nav-bar"></div>

    </div>

    <script src="metadata.js"></script>
    <script src="data.js"></script>
    <script src="render.js"></script>
    <script src="autosave.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            initAutosave();

            const w = appData.viewer.welcome;
            document.querySelector('#welcome-viewer h3[data-lang="bg"]').textContent = w.title.bg;
            document.querySelector('#welcome-viewer h3[data-lang="en"]').textContent = w.title.en;
            document.querySelector('#welcome-viewer p[data-lang="bg"]').textContent = w.description.bg;
            document.querySelector('#welcome-viewer p[data-lang="en"]').textContent = w.description.en;

            const dt = appData.viewer.defaultTitle;
            document.getElementById('active-viewer-title-bg').textContent = dt.bg;
            document.getElementById('active-viewer-title-en').textContent = dt.en;
        });
    </script>
    <script src="app.js"></script>

</body>
</html>
